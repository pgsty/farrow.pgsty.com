faq:
  eyebrow: 简短回答
  title: 开始之前
  items:
    - question: 工作目录还是 Farrow 项目吗？
      answer: 不是。状态是 ~/.farrow 下唯一的一套 deployment；显式或当前目录发现的 Inventory 提供期望状态，没有文件时生命周期命令可回退到已应用规格。
      open: true
    - question: 可以直接使用 pigsty.yml 吗？
      answer: 可以。Farrow 读取已记录的 VM 字段，以及用于命名、控制节点和管理员身份的一小组 Pigsty 字段；其余参数保持不透明。
    - question: setup 会修改宿主吗？
      answer: 会。依赖、固定 IP 网络与 hosts helper 变更都会先展示并确认；Linux 网络 smoke 失败会按归属 manifest 回滚。
    - question: Farrow 可以用于生产吗？
      answer: 不可以。它仍是 pre-1.0 的本地开发运行时；请在状态页查看准确验证矩阵与开放门禁。

