first_command:
  eyebrow: 正常路径
  title: 准备一次，然后启动
  text: 在 farrow.yml 或 pigsty.yml 所在目录执行。
  code: |-
    farrow setup
    farrow up
    farrow status
  lang: bash
  note: 增加主机行后再次 up：创建新节点、启动选中的已停止节点，运行中节点不受影响；删掉一行永远不会删除 VM。

