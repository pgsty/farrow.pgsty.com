first_command:
  eyebrow: Normal path
  title: Prepare once, then boot
  text: Run these commands beside farrow.yml or pigsty.yml.
  code: |-
    farrow setup
    farrow up
    farrow status
  lang: bash
  note: Add host lines and run up again; new nodes are created, stopped selected nodes start, and running peers stay untouched. Removing a line never destroys a VM.

