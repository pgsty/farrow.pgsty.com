    - { icon: fa-solid fa-server, title: Node-granular, desc: Additions are incremental; changes and deletion require explicit commands. }
    - { icon: fa-solid fa-fingerprint, title: Owned, desc: "Process identity, ownership, paths, and network manifests are verified before mutation." }
