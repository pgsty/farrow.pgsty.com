hero:
  eyebrow: Pre-1.0 · Native Go + QEMU
  title_lines:
    - One inventory.
    - One deployment.
  title_size: 4.15rem
  lead: >-
    Farrow boots a Pigsty-compatible inventory into fixed-IP QEMU virtual
    machines on macOS and Linux. The same file describes the VMs and deploys
    Pigsty; there is no project model or second configuration to reconcile.
  note: The simplified line was last native-replayed on macOS arm64 and Ubuntu amd64 on 2026-08-27; no public v1 package exists yet.
  note_icon: fa-solid fa-flask
  image:
    light: images/farrow-hero-light.svg?v=20260827
    dark: images/farrow-hero-dark.svg?v=20260827
    alt: One Pigsty inventory becomes one fixed-IP Farrow deployment
  actions:
    - { label: Follow the tutorial, url: docs/start/tutorial/, icon: fa-solid fa-rocket, style: primary }
    - { label: Read the reference, url: docs/reference/, icon: fa-solid fa-book-open, style: ghost }
  detail:
    label: Native validation and limits
    url: docs/about/status/
    icon: fa-solid fa-list-check

