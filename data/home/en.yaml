first_command:
  eyebrow: Normal path
  title: Two commands to prepare and boot
  text: Run them in an empty directory; setup creates the default one-node inventory.
  code: |-
    farrow setup
    farrow up
  lang: bash
  note: Add host lines and run up again; new nodes are created, stopped selected nodes start, and running peers stay untouched. Removing a line never destroys a VM.

