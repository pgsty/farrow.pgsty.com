faq:
  eyebrow: Short answers
  title: Before you begin
  items:
    - question: Is the working directory still a Farrow project?
      answer: No. State is one deployment under ~/.farrow. An explicit or discovered Inventory supplies desired state; without one, lifecycle commands can fall back to the applied spec.
      open: true
    - question: Can I use pigsty.yml directly?
      answer: Yes. Farrow consumes the documented VM fields plus a small naming, control-node, and node-admin whitelist; other Pigsty settings stay opaque.
    - question: Does setup modify the host?
      answer: Yes. It prints and confirms dependency, fixed-IP network, and hosts-helper changes. In an empty directory it also creates the default one-node inventory.
    - question: Is Farrow ready for production?
      answer: No. It is a pre-1.0 local development runtime; read the status page for the exact verified matrix and open release gates.

